[project]
name = "querypilot"
version = "0.1.0"
description = "Self-hosted, user-aware natural-language-to-SQL agent with memory and row-level security."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0,<7",
    "openai>=1.50",
    "chromadb>=0.5",
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",          # SQL parsing for the RLS rewrite (Stage 2)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic punctuation in UI text is intentional
